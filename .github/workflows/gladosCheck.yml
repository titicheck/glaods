name: GLaDOS Railgun Check-in

on:
  workflow_dispatch:

  schedule:
    # 北京时间次日 05:17（UTC 21:17）
    - cron: "17 21 * * *"

    # 北京时间当日 17:47（UTC 09:47）
    - cron: "47 9 * * *"

permissions:
  contents: read

jobs:
  checkin:
    name: Python 3.11 check-in
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Run check-in and send notification
        env:
          GLADOS_ROCKS_COOKIES: ${{ secrets.GLADOS_ROCKS_COOKIES }}
          GLADOS_ROCKS_PLANS: ${{ secrets.GLADOS_ROCKS_PLANS }}
          GLADOS_ROCKS_USER_AGENTS: ${{ secrets.GLADOS_ROCKS_USER_AGENTS }}

          RAILGUN_INFO_COOKIES: ${{ secrets.RAILGUN_INFO_COOKIES }}
          RAILGUN_INFO_PLANS: ${{ secrets.RAILGUN_INFO_PLANS }}
          RAILGUN_INFO_USER_AGENTS: ${{ secrets.RAILGUN_INFO_USER_AGENTS }}

          QYWX_KEY: ${{ secrets.QYWX_KEY }}
          QYWX_AM: ${{ secrets.QYWX_AM }}

          GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
        run: python checkin.py
