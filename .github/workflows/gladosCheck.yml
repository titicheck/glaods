name: GLaDOS Railgun Check-in

on:
  # 保留手动运行按钮
  workflow_dispatch:

  # 北京时间自动运行
  schedule:
    # 每天 08:17 正常签到
    - cron: "17 7 * * *"
      timezone: "Asia/Shanghai"

    # 每天 20:27 失败补签
    - cron: "27 20 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

jobs:
  checkin:
    name: Python 3.11 check-in
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run check-in
        env:
          GLADOS_ROCKS_COOKIES: ${{ secrets.GLADOS_ROCKS_COOKIES }}
          GLADOS_ROCKS_PLANS: ${{ secrets.GLADOS_ROCKS_PLANS }}
          RAILGUN_INFO_COOKIES: ${{ secrets.RAILGUN_INFO_COOKIES }}
          RAILGUN_INFO_PLANS: ${{ secrets.RAILGUN_INFO_PLANS }}
          QYWX_KEY: ${{ secrets.QYWX_KEY }}
          QYWX_AM: ${{ secrets.QYWX_AM }}
          GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
        run: python checkin.py
